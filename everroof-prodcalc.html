<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Roof Coating Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 2em auto; }
    label { display: block; margin-top: 1em; }
    .result { margin-top: 2em; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Roof Coating Calculator</h2>

  <form id="calcForm">
    <label>
      Select Substrate:
      <select id="substrate">
        <option value="concrete">Concrete</option>
        <option value="metal">Metal</option>
        <option value="bitumen">Bitumen</option>
        <option value="epdm">EPDM</option>
        <option value="pvc">PVC</option>
        <option value="tpo">TPO</option>
      </select>
    </label>

    <label>
      Select Warranty:
      <input type="radio" name="warranty" value="10" checked> 10 Years
      <input type="radio" name="warranty" value="15"> 15 Years
      <input type="radio" name="warranty" value="20"> 20 Years
    </label>

    <label>
      Project Area (in square feet):
      <input type="number" id="area" required>
    </label>

    <button type="button" onclick="calculate()">Calculate</button>
  </form>

  <div class="result" id="result"></div>

  <script>
    function calculate() {
      const area = parseFloat(document.getElementById("area").value);
      if (isNaN(area) || area <= 0) {
        alert("Please enter a valid square footage.");
        return;
      }

      const product_coverage = 10000; // 1.5 gallons covers 10,000 ft²
      const overage_percentage = 0.10; // 10%

      const total_quantity = (area / product_coverage) * (1 + overage_percentage);

      const substrate = document.getElementById("substrate").value;
      const warranty = document.querySelector('input[name="warranty"]:checked').value;

      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = `
        <p><strong>Results:</strong></p>
        <ul>
          <li>Substrate: ${substrate}</li>
          <li>Warranty: ${warranty} years</li>
          <li>Project Area: ${area.toLocaleString()} ft²</li>
          <li>Total Coating Needed: <strong>${total_quantity.toFixed(2)}</strong> gallons</li>
        </ul>
      `;
    }
  </script>
  
</body>
</html>
